<div class="col-md-4 mb-3">
    <article class="card employee-card">
        <div class="card-body">
            <h5 class="card-title">{{ employee.name|default:"Без имени" }}</h5>
            <p class="card-text">Должность: {{ employee.position }}</p>
            <a href="{% url 'employees:detail' employee.id %}"
               class="btn btn-primary">
                Подробнее
            </a>
        </div>
    </article>
</div>
